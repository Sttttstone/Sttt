<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>德伦口腔｜医生图片加Logo工具</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: system-ui, -apple-system, sans-serif;
  }
  body {
    background: #f0f7ff;
    padding:16px;
  }
  .container {
    max-width:700px;
    margin:0 auto;
  }
  .card {
    background:#fff;
    border-radius:14px;
    padding:20px;
    box-shadow: 0 4px 16px rgba(0,120,210,0.08);
  }
  h2 {
    font-size:19px;
    color:#0066b3;
    margin-bottom:6px;
    text-align:center;
  }
  .tip {
    font-size:13px;
    color:#64748b;
    margin-bottom:18px;
    text-align:center;
  }
  .row{
    margin-bottom:18px;
  }
  label{
    display:block;
    font-size:14px;
    color:#334155;
    margin-bottom:6px;
  }
  select{
    width:100%;
    padding:12px 10px;
    border:1px solid #cbd5e1;
    border-radius:8px;
    font-size:16px;
  }
  .upload-box{
    border:2px dashed #cbd5e1;
    border-radius:10px;
    padding:24px 12px;
    text-align:center;
    cursor:pointer;
    background:#fafbfd;
  }
  .upload-box:active{
    background:#eaf4ff;
    border-color:#0066b3;
  }
  .upload-box p{
    color:#334155;
    font-size:15px;
  }
  .control-row{
    display:flex;
    align-items:center;
    gap:10px;
  }
  input[type="range"]{
    flex:1;
  }
  #sizeValue{
    min-width:40px;
    color:#0066b3;
  }
  #canvasWrap{
    overflow:hidden;
    border:1px solid #e5e7eb;
    border-radius:10px;
    text-align:center;
  }
  #previewCanvas{
    max-width:100%;
    display:block;
    touch-action:none;
  }
  .btns{
    display:flex;
    gap:10px;
    margin-top:18px;
  }
  button{
    flex:1;
    padding:12px;
    border:none;
    border-radius:8px;
    font-size:16px;
    color:#fff;
    cursor:pointer;
  }
  #download{
    background:#10b981;
  }
  #reset{
    background:#64748b;
  }
  input[type="file"]{display:none;}
</style>
</head>
<body>
<div class="container">
  <div class="card">
    <h2>德伦口腔 中山八路医生logo(小石制作)</h2>
    <p class="tip">选择医生 → 上传素材 → 拖动Logo → 保存图片</p>

    <div class="row">
      <label>👨‍⚕️ 选择医生</label>
      <select id="doctorSelect">
        <option value="">请选择医生</option>
        <option value="drA">德伦口腔主logo</option>
        <option value="drB">杨腾飞</option>
        <option value="drC">翁嘉华</option>
        <option value="drD">范佳乐</option>
        <option value="drE">黄健华</option>
        <option value="drF">李嘉莹</option>
        <option value="drG">张佳佳</option>
        <option value="drH">陈建良</option>
        <option value="drI">陈泽辉</option>
        <option value="drJ">李文英</option>
      </select>
    </div>

    <div class="row">
      <div class="upload-box" onclick="document.getElementById('imgFile').click()">
        <p>📷 点击上传图片素材</p>
        <input id="imgFile" type="file" accept="image/*" />
      </div>
    </div>

    <div class="row control-row">
      <label>Logo大小：</label>
      <input type="range" id="logoSize" min="60" max="900" value="220" step="1"/>
      <span id="sizeValue">220</span>
    </div>

    <div id="canvasWrap">
      <canvas id="previewCanvas"></canvas>
    </div>

    <div class="btns">
      <button id="download">💾 下载图片</button>
      <button id="reset">🔄 重置</button>
    </div>
  </div>
</div>

// 初始化画布
function initCanvas(){
  canvas.width=800;canvas.height=600;
  ctx.fillStyle="#fafafa";
  ctx.fillRect(0,0,canvas.width,canvas.height);
}
initCanvas();

// 切换医生，加载内置logo
doctorSelect.onchange = function(){
  const key = this.value;
  if(!key){logoImg=null;draw();return;}
  logoImg = new Image();
  logoImg.src = doctorLogos[key];
  logoImg.onload = function(){
    logoRatio = logoImg.width / logoImg.height;
    logo.w = Number(sizeSlider.value);
    logo.h = logo.w / logoRatio;
    draw();
  }
}

// 上传底图
document.getElementById("imgFile").onchange = function(e){
  const f = e.target.files[0];
  if(!f)return;
  const reader = new FileReader();
  reader.onload = function(ev){
    const img = new Image();
    img.onload = function(){
      baseImg = img;
      logo.x=40;logo.y=40;
      draw();
    }
    img.src = ev.target.result;
  }
  reader.readAsDataURL(f);
}

// 绘制
function draw(){
  if(!baseImg) return;
  canvas.width = baseImg.width;
  canvas.height = baseImg.height;
  ctx.drawImage(baseImg,0,0);
  if(logoImg && logoImg.complete){
    logo.h = logo.w / logoRatio;
    ctx.drawImage(logoImg, logo.x, logo.y, logo.w, logo.h);
  }
}

// ====== 鼠标 + 手机触屏拖拽 ======
function getPos(e){
  const rect = canvas.getBoundingClientRect();
  canvasScale = canvas.width / rect.width;
  const touch = e.touches ? e.touches[0] : e;
  return {
    x: (touch.clientX - rect.left) * canvasScale,
    y: (touch.clientY - rect.top) * canvasScale
  }
}

canvas.addEventListener("mousedown",startDrag);
canvas.addEventListener("touchstart",startDrag,{passive:false});
function startDrag(e){
  if(!logoImg || !baseImg) return;
  e.preventDefault();
  const p = getPos(e);
  if(p.x >= logo.x && p.x <= logo.x+logo.w && p.y >= logo.y && p.y <= logo.y+logo.h){
    logo.isDrag = true;
  }
}

window.addEventListener("mousemove",dragMove);
window.addEventListener("touchmove",dragMove,{passive:false});
function dragMove(e){
  if(!logo.isDrag) return;
  e.preventDefault();
  const p = getPos(e);
  logo.x = p.x - logo.w/2;
  logo.y = p.y - logo.h/2;
  draw();
}

window.addEventListener("mouseup",()=>logo.isDrag=false);
window.addEventListener("touchend",()=>logo.isDrag=false);

// 大小滑块
sizeSlider.oninput = function(){
  if(!logoImg || !baseImg) return;
  logo.w = Number(this.value);
  logo.h = logo.w / logoRatio;
  sizeValue.textContent = logo.w;
  draw();
}

//下载
document.getElementById("download").onclick = function(){
  if(!baseImg){alert("请先上传素材图片");return;}
  if(!logoImg){alert("请先选择医生");return;}
  const a = document.createElement("a");
  a.href = canvas.toDataURL("image/png");
  a.download="德伦口腔宣传图.png";
  a.click();
}

//重置
document.getElementById("reset").onclick = function(){
  baseImg=null;logoImg=null;
  document.getElementById("imgFile").value="";
  doctorSelect.value="";
  logo = {x:40,y:40,w:220,h:0,isDrag:false};
  initCanvas();
  draw();
}
</script>
